[sandbox]
hypervisor           = "QEMU"
qemu_system_path     = "C:\\Program Files\\qemu\\qemu-system-x86_64.exe"
qemu_img_path        = "C:\\Program Files\\qemu\\qemu-img.exe"
vm_image_path        = "C:\\ADAM_Sandbox\\images\\win10-gold.qcow2"
snapshot_name        = "clean_snapshot"
boot_timeout_s       = 120
detonation_timeout_s = 300
network_mode         = "SIMULATED"
hostfwd_port_host    = 8443
hostfwd_port_guest   = 8443
memory_mb            = 4096
cpu_count            = 4
sample_dir           = "samples"
manage_vm            = false
use_virtio_serial    = true
serial_pipe_name     = "127.0.0.1:8444"

[fusion]
window_seconds       = 5.0
max_window_events    = 10000
min_confidence_emit  = 0.40
process_tree_depth   = 10

[policy]
ruleset_path            = "rules/default"
global_confidence_gate  = 0.60
max_mutations_per_session = 15
default_cooldown_s      = 20
dry_run                 = false

[deception]
default_causal_window_ms = 30000
plausibility_warn_below  = 0.50
enable_clock_manipulation = false

[bus]
default_queue_size = 1000
overflow_policy    = "DROP_OLDEST"

[db]
path             = "artifacts/adam.sqlite"
batch_size       = 500
batch_interval_ms = 250

[logging]
level      = "INFO"
format     = "json"
directory  = "logs"
