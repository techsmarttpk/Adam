      minimum_events: 1
    detector_requirements:
      detector: "detect_domain_recon"
      expected_confidence_minimum: 0.90
    policy_requirements:
      expected_rule: "RULE-RECON-001"
      expected_verdict: "EXECUTE"
    mutation_requirements:
      primitive: "SPAWN_FAKE_DC_ARTIFACTS"
      expected_status: "APPLIED"
    environment_verification_requirements:
      checks:
        - type: "REGISTRY"
          target: "HKLM\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters\\Domain"
          expected_contains: "CORP.LOCAL"
        - type: "NETWORK"
          target: "dns:DC01.CORP.LOCAL"
          expected_contains: "10.0.0.10"
    causal_requirements:
      require_post_mutation_event: true
      require_caused_by_mutation: true

  - command_id: "high_browser_creds"
    name: "Browser Credential Search"
    severity: "HIGH"
