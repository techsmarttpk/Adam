      minimum_events: 1
    detector_requirements:
      detector: "detect_shadow_copy_deletion"
      expected_confidence_minimum: 0.95
    policy_requirements:
      expected_rule: "RULE-IMPACT-001"
      expected_verdict: "EXECUTE"
    mutation_requirements:
      primitive: "CREATE_DECOY_RECOVERY_TARGET"
      expected_status: "APPLIED"
    environment_verification_requirements:
      checks:
        - type: "FILE"
          target: "C:\\SystemRecovery\\DecoyBackups\\shadow_volume_copy_01.vhd"
          expected_contains: "SIMULATED_SHADOW_VOLUME"
    causal_requirements:
      require_post_mutation_event: false
      require_caused_by_mutation: false

