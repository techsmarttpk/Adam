version: "1.0.0"
description: "ADAM Mutation Test Ground-Truth Validation Manifest"

commands:
  - command_id: "crit_vm_check"
    name: "VM Artifact Check"
    severity: "CRITICAL"
    expected_intent: "EVADE_VM_ARTIFACT_CHECK"
    expected_policy_action: "SPOOF_HARDWARE_IDENTITY"
    expected_action_category: "MUTATE"
    telemetry_requirements:
      sources: ["SYSMON"]
      event_patterns: ["HKLM\\HARDWARE\\DESCRIPTION\\System"]
      minimum_events: 1
    detector_requirements:
      detector: "detect_vm_artifact_checks"
      expected_confidence_minimum: 0.85
    policy_requirements:
      expected_rule: "RULE-EVADE-001"
      expected_verdict: "EXECUTE"
    mutation_requirements:
      primitive: "SPOOF_HARDWARE_IDENTITY"
      expected_status: "APPLIED"
    environment_verification_requirements:
      checks:
        - type: "REGISTRY"
          target: "HKLM\\HARDWARE\\DESCRIPTION\\System\\SystemBiosVersion"
          expected_contains: "DELL"
    causal_requirements:
      require_post_mutation_event: false
      require_caused_by_mutation: false

  - command_id: "crit_process_hollowing"
    name: "Process Hollowing Probe"
    severity: "CRITICAL"
    expected_intent: "INJECT_PROCESS_HOLLOWING"
    expected_policy_action: "ACTIVATE_EPT_SHADOW_HOOK"
    expected_action_category: "MEASUREMENT"
    telemetry_requirements:
      sources: ["SYSMON"]
      event_patterns: ["hollowing"]
      minimum_events: 1
    detector_requirements:
      detector: "detect_process_hollowing"
      expected_confidence_minimum: 0.90
    policy_requirements:
      expected_rule: "RULE-INJECT-002"
      expected_verdict: "EXECUTE"
    mutation_requirements:
      primitive: "ACTIVATE_EPT_SHADOW_HOOK"
      expected_status: "APPLIED"
    environment_verification_requirements:
      checks:
        - type: "MEASUREMENT"
          target: "EPT_HYPERVISOR_MONITOR"
          expected_contains: "ACTIVATE_EPT_SHADOW_HOOK"
    causal_requirements:
      require_post_mutation_event: false
      require_caused_by_mutation: false

  - command_id: "crit_cloud_creds"
    name: "Cloud Credential Search"
    severity: "CRITICAL"
    expected_intent: "CRED_CLOUD_CREDENTIAL_SEARCH"
    expected_policy_action: "PLANT_DECOY_CLOUD_CREDENTIALS"
    expected_action_category: "MUTATE"
    telemetry_requirements:
      sources: ["SYSMON"]
      event_patterns: [".aws\\credentials"]
      minimum_events: 1
    detector_requirements:
      detector: "detect_cloud_credential_access"
      expected_confidence_minimum: 0.85
    policy_requirements:
      expected_rule: "RULE-CRED-004"
      expected_verdict: "EXECUTE"
    mutation_requirements:
      primitive: "PLANT_DECOY_CLOUD_CREDENTIALS"
      expected_status: "APPLIED"
    environment_verification_requirements:
      checks:
        - type: "FILE"
          target: "%USERPROFILE%\\.aws\\credentials"
          expected_contains: "aws_access_key_id"
    causal_requirements:
      require_post_mutation_event: false
      require_caused_by_mutation: false

  - command_id: "crit_c2_dga"
    name: "C2 DGA Probe"
    severity: "CRITICAL"
    expected_intent: "C2_DGA_ACTIVITY"
    expected_policy_action: "ACTIVATE_C2_SINKHOLE"
    expected_action_category: "MUTATE"
    telemetry_requirements:
      sources: ["WIRESHARK"]
      event_patterns: [".biz"]
      minimum_events: 1
    detector_requirements:
      detector: "detect_dga_activity"
      expected_confidence_minimum: 0.85
    policy_requirements:
      expected_rule: "RULE-C2-001"
      expected_verdict: "EXECUTE"
    mutation_requirements:
      primitive: "ACTIVATE_C2_SINKHOLE"
      expected_status: "APPLIED"
    environment_verification_requirements:
      checks:
        - type: "NETWORK"
          target: "firewall:sinkhole_redirect"
          expected_contains: "127.0.0.1:8443"
    causal_requirements:
      require_post_mutation_event: false
      require_caused_by_mutation: false

  - command_id: "crit_shadow_copy_delete"
    name: "Shadow Copy Deletion"
    severity: "CRITICAL"
    expected_intent: "IMPACT_SHADOW_COPY_DELETE"
    expected_policy_action: "CREATE_DECOY_RECOVERY_TARGET"
    expected_action_category: "MUTATE"
    telemetry_requirements:
