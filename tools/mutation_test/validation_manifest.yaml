    causal_requirements:
      require_post_mutation_event: false
      require_caused_by_mutation: false

  - command_id: "high_recon_dc"
    name: "Domain Controller Discovery"
    severity: "HIGH"
    expected_intent: "RECON_DOMAIN_CONTROLLER"
    expected_policy_action: "SPAWN_FAKE_DC_ARTIFACTS"
    expected_action_category: "MUTATE"
    telemetry_requirements:
      sources: ["SYSMON"]
