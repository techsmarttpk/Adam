# Persistence Policy Rules
- id: RULE-PERSIST-001
  severity: HIGH
  rationale: "Registry Run key persistence; observe."
  when:
    intent: PERSIST_RUN_KEY
    confidence_gte: 0.80
  then:
    action: NONE
    action_category: OBSERVE
    default_verdict: OBSERVE
    priority: 70
  budget:
    max_per_session: 5
    cooldown_seconds: 15

