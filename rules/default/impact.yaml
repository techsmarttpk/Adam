# Impact & Ransomware Policy Rules
- id: RULE-IMPACT-001
  severity: CRITICAL
  rationale: "Shadow copy deletion; create decoy recovery target."
  when:
    intent: IMPACT_SHADOW_COPY_DELETE
    confidence_gte: 0.85
  then:
    action: CREATE_DECOY_RECOVERY_TARGET
    action_category: MUTATE
    default_verdict: EXECUTE
    priority: 99
  budget:
    max_per_session: 1
    cooldown_seconds: 30

- id: RULE-IMPACT-002
  severity: HIGH
  rationale: "Ransom note dropped; enable file activity monitor."
  when:
    intent: IMPACT_RANSOM_NOTE_DROP
    confidence_gte: 0.80
  then:
    action: ENABLE_FILE_ACTIVITY_MONITOR
    action_category: MEASUREMENT
    default_verdict: EXECUTE
    priority: 90
  budget:
    max_per_session: 2
    cooldown_seconds: 20

