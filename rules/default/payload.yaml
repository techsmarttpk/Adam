# Payload & Unpacking Policy Rules
- id: RULE-PAYLOAD-001
  severity: HIGH
  rationale: "Payload decryption detected; activate EPT memory capture."
  when:
    intent: PAYLOAD_DECRYPTION
    confidence_gte: 0.80
  then:
    action: ACTIVATE_EPT_MEMORY_CAPTURE
    action_category: MEASUREMENT
    default_verdict: EXECUTE
    priority: 85
  budget:
    max_per_session: 2
    cooldown_seconds: 20

