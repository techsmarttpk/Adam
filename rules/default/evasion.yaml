# Defense Evasion Policy Rules
- id: RULE-EVADE-001
  severity: HIGH
  rationale: "AMSI bypass attempt; simulate AMSI target."
  when:
    intent: EVADE_AMSI_BYPASS
    confidence_gte: 0.80
  then:
    action: SIMULATE_AMSI_TARGET
    action_category: MUTATE
    default_verdict: EXECUTE
    priority: 85
  budget:
    max_per_session: 1
    cooldown_seconds: 30

