# Lateral Movement Policy Rules
- id: RULE-LATERAL-001
  severity: HIGH
  rationale: "SMB share access; mount fake network share."
  when:
    intent: LATERAL_SMB_SHARE_ACCESS
    confidence_gte: 0.75
  then:
    action: MOUNT_FAKE_NETWORK_SHARE
    action_category: MUTATE
    default_verdict: EXECUTE
    priority: 80
  budget:
    max_per_session: 1
    cooldown_seconds: 30

