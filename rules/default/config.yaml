# Malware Configuration Search Policy Rules
- id: RULE-CFG-001
  severity: MEDIUM
  rationale: "C2 config search; observe."
  when:
    intent: CONFIG_C2_CONFIG_SEARCH
    confidence_gte: 0.70
  then:
    action: NONE
    action_category: OBSERVE
    default_verdict: OBSERVE
    priority: 40
  budget:
    max_per_session: 5
    cooldown_seconds: 10

