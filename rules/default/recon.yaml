# Discovery & Reconnaissance Policy Rules
- id: RULE-RECON-001
  severity: HIGH
  rationale: "Domain controller discovery indicates active lateral prep; synthesize fake DC environment."
  when:
    intent: RECON_DOMAIN_CONTROLLER
    confidence_gte: 0.75
  then:
    action: SPAWN_FAKE_DC_ARTIFACTS
    action_category: MUTATE
    default_verdict: EXECUTE
    priority: 80
  budget:
    max_per_session: 1
    cooldown_seconds: 30

