# Process Injection Policy Rules
- id: RULE-INJECT-001
  severity: CRITICAL
  rationale: "Remote thread injection; activate memory monitor."
  when:
    intent: INJECT_REMOTE_THREAD
    confidence_gte: 0.85
  then:
    action: ACTIVATE_MEMORY_MONITOR
    action_category: MEASUREMENT
    default_verdict: EXECUTE
    priority: 95
  budget:
    max_per_session: 2
    cooldown_seconds: 20

