# Data Collection Policy Rules
- id: RULE-COLLECT-001
  severity: HIGH
  rationale: "Documents collection; plant decoy documents."
  when:
    intent: COLLECT_DOCUMENTS
    confidence_gte: 0.75
  then:
    action: PLANT_DECOY_DOCUMENTS
    action_category: MUTATE
    default_verdict: EXECUTE
    priority: 85
  budget:
    max_per_session: 2
    cooldown_seconds: 20

