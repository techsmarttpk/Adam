# Execution Policy Rules
- id: RULE-EXEC-001
  severity: MEDIUM
  rationale: "PowerShell interpreter execution; observe to feed higher-level inference."
  when:
    intent: EXEC_POWERSHELL
    confidence_gte: 0.70
  then:
    action: NONE
    action_category: OBSERVE
    default_verdict: OBSERVE
    priority: 40
  budget:
    max_per_session: 10
    cooldown_seconds: 5

