# Anti-Forensics Policy Rules
- id: RULE-AF-001
  severity: CRITICAL
  rationale: "Event log clear; observe anti-forensics behavior."
  when:
    intent: ANTI_FORENSICS_EVENT_LOG_CLEAR
    confidence_gte: 0.90
  then:
    action: NONE
    action_category: OBSERVE
    default_verdict: OBSERVE
    priority: 90
  budget:
    max_per_session: 5
    cooldown_seconds: 15

- id: RULE-AF-002
  severity: HIGH
  rationale: "File deletion; observe."
  when:
