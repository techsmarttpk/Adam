# Command and Control (C2) Policy Rules
- id: RULE-C2-001
  severity: MEDIUM
  rationale: "DNS lookup for external C2; observe."
  when:
    intent: C2_DNS_LOOKUP
    confidence_gte: 0.70
  then:
    action: NONE
    action_category: OBSERVE
    default_verdict: OBSERVE
    priority: 40
  budget:
    max_per_session: 10
    cooldown_seconds: 5

- id: RULE-C2-002
  severity: HIGH
  rationale: "Outbound C2 beacon; fabricate synthetic C2 response."
  when:
    intent: C2_BEACON
    confidence_gte: 0.80
  then:
    action: FABRICATE_C2_RESPONSE
    action_category: MUTATE
    default_verdict: EXECUTE
    priority: 85
  budget:
    max_per_session: 3
    cooldown_seconds: 15

