- id: RULE-019
  version: "1.0.0"
  description: >
    Browser store credential search
  when:
    intent: CRED_BROWSER_STORE
    confidence_gte: 0.75
  then:
    action: INJECT_FAKE_BROWSER_CREDS
    priority: 75
  budget:
    max_per_session: 1
    cooldown_seconds: 60

- id: RULE-020
  version: "1.0.0"
  description: >
    Crypto wallet search
  when:
    intent: CRED_WALLET_SEARCH
    confidence_gte: 0.80
  then:
    action: PLANT_DECOY_WALLET
    priority: 80
  budget:
    max_per_session: 1
    cooldown_seconds: 60
