# Credential Access Policy Rules
- id: RULE-CRED-001
  severity: HIGH
  rationale: "Browser store access; inject fake browser login credentials."
  when:
    intent: CRED_BROWSER_STORE
    confidence_gte: 0.75
  then:
    action: INJECT_FAKE_BROWSER_CREDS
    action_category: MUTATE
    default_verdict: EXECUTE
    priority: 85
  budget:
    max_per_session: 1
    cooldown_seconds: 30

