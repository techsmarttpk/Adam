# Compound / Attack Campaign Policy Rules
- id: RULE-CMP-001
  severity: HIGH
  rationale: "Compound Credential Harvesting campaign detected; plant decoy credential artifacts."
  when:
    intent: CAMPAIGN_CREDENTIAL_HARVEST
    confidence_gte: 0.85
  then:
    action: PLANT_DECOY_CREDENTIAL_ARTIFACTS
    action_category: MUTATE
    default_verdict: EXECUTE
    priority: 95
  budget:
    max_per_session: 1
    cooldown_seconds: 30

